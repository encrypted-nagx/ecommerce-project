<!DOCTYPE html>
<html>
<head>
<title>Register</title>
<style>

body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:linear-gradient(135deg,#667eea,#764ba2);
    min-height:100vh;
}

.navbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:18px 40px;
    background:rgba(255,255,255,0.15);
}

.logo{
    color:white;
    font-size:28px;
    font-weight:bold;
}

.nav-links a{
    color:white;
    text-decoration:none;
    margin-left:20px;
    font-size:18px;
}

.nav-links a:hover{
    color:yellow;
}

h2{
    text-align:center;
    color:white;
    margin-top:60px;
}

input{
    display:block;
    width:320px;
    margin:15px auto;
    padding:12px;
    border:none;
    border-radius:8px;
    font-size:16px;
}

button{
    display:block;
    width:345px;
    margin:20px auto;
    padding:12px;
    background:#00c853;
    color:white;
    border:none;
    border-radius:8px;
    font-size:18px;
    cursor:pointer;
}

button:hover{
    background:#009624;
}

</style>

</head>

<body>

    <div class="navbar">
    <h1 class="logo"><a href="products.html" style="color: inherit; text-decoration: none;">CYBERVALUT</a></h1>
    <div class="nav-links">
        <a href="products.html">Products</a>
        <a href="cart.html">Cart</a>
        <!--<a href="admin.html">Admin</a> -->
    </div>
</div>

<div class="register-box">

    <h2>User Registration</h2>

    <input id="name" placeholder="Name">
    <input id="email" placeholder="Email">
    <input id="password" placeholder="Password" type="password">

    <button onclick="registerUser()">Register</button>

</div>

<script>

function registerUser(){

const name = document.getElementById("name").value
const email = document.getElementById("email").value
const password = document.getElementById("password").value

fetch("https://ecommerce-backend-gf0i.onrender.com/register",{
method:"POST",
headers:{
"Content-Type":"application/json"
},

body: JSON.stringify({
name:name,
email:email,
password:password
})

})
.then(res => res.text())
.then(data => alert(data))

}

</script>

</body>
</html>
